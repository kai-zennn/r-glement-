<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Némésis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07050a;
    --bg-alt:#0f0a14;
    --pink:#ff2fb0;
    --pink-soft:#ff8bd6;
    --purple:#7a1fd1;
    --text:#eae6ec;
    --text-dim:#a297a8;
    --border:#241a2c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,47,176,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Oswald', Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 48px;
    border-bottom:1px solid var(--border);
    background:var(--bg-alt);
  }
  .logo{
    font-family:'Permanent Marker', cursive;
    font-size:1.5rem;
    letter-spacing:1px;
    color:var(--pink);
    text-shadow:0 0 12px rgba(255,47,176,0.6);
  }
  nav a{
    color:var(--text-dim);
    text-decoration:none;
    margin-left:32px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:0.82rem;
    transition:color .2s;
  }
  nav a:hover, nav a.active{
    color:var(--pink);
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 24px;
  }
  .crest{
    width:220px;
    max-width:60vw;
    filter:drop-shadow(0 0 30px rgba(255,47,176,0.35));
    margin-bottom:20px;
    border-radius:12px;
  }
  h1{
    font-family:'Permanent Marker', cursive;
    font-size:4rem;
    letter-spacing:3px;
    color:var(--pink-soft);
    text-shadow:
      0 0 10px rgba(255,47,176,0.8),
      0 0 30px rgba(255,47,176,0.5),
      0 0 60px rgba(122,31,209,0.4);
    line-height:1.1;
  }
  .tagline{
    color:var(--text-dim);
    font-size:1rem;
    letter-spacing:4px;
    margin:18px 0 12px;
    text-transform:uppercase;
  }
  .values{
    display:flex;
    gap:32px;
    margin:20px 0 44px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .values span{
    font-family:'Permanent Marker', cursive;
    color:var(--pink);
    font-size:1rem;
    letter-spacing:1px;
    text-shadow:0 0 8px rgba(255,47,176,0.5);
  }
  .divider{
    width:70px;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--pink), transparent);
    margin-bottom:36px;
  }
  .cta{
    display:inline-block;
    padding:16px 42px;
    background:linear-gradient(90deg, var(--pink), var(--purple));
    color:#fff;
    text-decoration:none;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    border-radius:2px;
    box-shadow:0 0 25px rgba(255,47,176,0.35);
    transition:transform .2s, box-shadow .2s;
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 0 35px rgba(255,47,176,0.55);
  }
  footer{
    text-align:center;
    padding:20px;
    color:var(--text-dim);
    font-size:0.78rem;
    letter-spacing:1px;
    border-top:1px solid var(--border);
    background:var(--bg-alt);
  }
</style>
</head>
<body>

<header>
  <div class="logo">Némésis</div>
  <nav>
    <a href="index.html" class="active">Accueil</a>
    <a href="reglement.html">Règlement</a>
  </nav>
</header>

<main>
  <img src="nemesis.png" alt="Némésis" class="crest">
  <div class="tagline">Organisation Criminelle — GTA RP</div>
  <div class="values">
    <span>Respect</span><span>·</span><span>Sérieux</span><span>·</span><span>Motivé</span>
  </div>
  <div class="divider"></div>
  <a href="reglement.html" class="cta">Voir le règlement</a>
</main>

<footer>
  © Némésis — Tous droits réservés
</footer>

</body>
</html>
